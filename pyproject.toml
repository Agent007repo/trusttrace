[project]
name = "trusttrace"
version = "0.0.1"
description = "Independent research foundation: TrustTrace"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12", "PyYAML>=6.0", "typer>=0.20", "httpx>=0.28", "fastapi>=0.120", "uvicorn>=0.38"]
[project.scripts]
trusttrace = "trusttrace.cli:app"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/trusttrace"]
[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7",
    "types-PyYAML>=6",
    "mkdocs-material>=9.6",
    "pre-commit>=4",
]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requirement(id): requirement whose fit criterion is tested"]
addopts = "--strict-markers"
junit_family = "xunit1"
[tool.coverage.run]
source = ["trusttrace"]
omit = ["*/cli.py", "*/app.py"]
branch = true
[tool.coverage.report]
fail_under = 85
show_missing = true
