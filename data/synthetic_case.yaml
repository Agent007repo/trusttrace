evidence:
- id: passing-scenario
  description: Executed software-test report, not research or human evidence
  provenance: synthetic
  path: results/raw/software-checks/junit.xml
risks:
- id: risk-disclosure
  description: Synthetic confidentiality risk
  consequence: Commercial or personal data reaches an unintended participant
  affected_stakeholders:
  - shipper
  - carrier
  - consignee
- id: risk-decision
  description: Synthetic unsupported-decision risk
  consequence: Unreviewed or unsupported advice changes a shipment decision
  affected_stakeholders:
  - broker
  - reviewer
  - authority
- id: risk-lineage
  description: Synthetic provenance risk
  consequence: Version or actor attribution cannot be reconstructed
  affected_stakeholders:
  - platform
  - provider
  - shipper
tactics:
- id: tactic-deny-default
  description: Deny roles outside the allowlist
  component: policy
- id: tactic-human-gate
  description: Keep all mock suggestions pending until a recorded human decision
  component: review
- id: tactic-citation-membership
  description: Validate retrieved citation membership; not entailment
  component: retrieval
- id: tactic-versioned-policy
  description: Policy changes create a new version; decisions keep the version they
    used
  component: disclosure
- id: tactic-disclosure-receipt
  description: Give data owners a receipt of shared and withheld fields
  component: disclosure
- id: tactic-purpose-bound-delegation
  description: Grant access per shipment and purpose with expiry and grantor-only
    revocation
  component: delegation
- id: tactic-purge-keep-hash
  description: Delete content at expiry; keep only a hash and lifecycle metadata
  component: retention
- id: tactic-contest-record
  description: Record contests and overrides as first-class audited events
  component: accountability
- id: tactic-evaluation-gate
  description: Refuse provider or version changes without a passing evaluation and
    a recorded decision
  component: gateway
- id: tactic-egress-gate
  description: Block raw documents to providers not approved for them
  component: gateway
- id: tactic-output-as-data
  description: Accept only the output contract; never execute model or retrieved text
  component: gateway
- id: tactic-quote-vs-interpretation
  description: Show verbatim source passages apart from generated text; label citation
    checks honestly
  component: explanation
- id: tactic-value-aware-diff
  description: Compare quantities with units and keep absent distinct from zero
  component: consistency
- id: tactic-external-anchor
  description: Checkpoint log count and head to a separate store; persist state atomically
  component: audit
